services:
  postgres:
    image: postgres:16-alpine
    container_name: openlearning-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-openlearning}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-openlearning}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openlearning-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: openlearning-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-openlearning}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openlearning-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: openlearning-worker
    command: ["bun", "run", "apps/worker/src/index.ts"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-openlearning}
      WORKER_CONCURRENCY: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openlearning-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: openlearning-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - openlearning-network
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001

  nginx:
    image: nginx:alpine
    container_name: openlearning-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - openlearning-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  openlearning-network:
    driver: bridge